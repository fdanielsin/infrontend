name: Frontend Svelte CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrontend/**'
      - '.github/workflows/svelte.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infrontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: cd infrontend && bun install
      
      - name: Type check
        run: cd infrontend && bun run check
      
      - name: Build
        run: cd infrontend && bun run build
      
      - name: Run unit tests
        run: cd infrontend && bun run test:unit

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: cd infrontend && bun install
      
      - name: Lint
        run: cd infrontend && bun run lint
      
      - name: Format check
        run: cd infrontend && bun run format -- --check

  e2e:
    runs-on: ubuntu-latest
    needs: [build, lint]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: cd infrontend && bun install
      
      - name: Install Playwright browsers
        run: cd infrontend && bun x playwright install --with-deps
      
      - name: Run E2E tests
        run: cd infrontend && bun x playwright test
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: infrontend/playwright-report/
          retention-days: 30

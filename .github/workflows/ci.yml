name: Frontend CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'inbackend branch or tag used for the contract check and the E2E'
        default: develop

env:
  BUN_VERSION: '1.3.0'
  PUBLIC_API_URL: 'http://localhost:8080'
  BACKEND_REF: ${{ inputs.backend_ref || 'develop' }}

jobs:
  # Same command as locally: format, lint, types, tests with coverage thresholds, build.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Verify'
        run: bun run verify

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Audit dependencies'
        run: bun audit --audit-level=moderate

  # Fails when src/lib/api/schema.d.ts no longer matches the backend contract.
  contract:
    name: Contract drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 'Checkout backend'
        uses: actions/checkout@v5
        with:
          repository: fdanielsin/inbackend
          ref: ${{ env.BACKEND_REF }}
          path: inbackend
          ssh-key: ${{ secrets.INBACKEND_DEPLOY_KEY }}
          persist-credentials: false

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Check generated types'
        env:
          OPENAPI_PATH: inbackend/docs/specs/api/openapi.yaml
        run: bun run api:check

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: [verify]
    steps:
      - uses: actions/checkout@v5

      - name: 'Build image (no push)'
        run: docker build --build-arg PUBLIC_API_URL="$PUBLIC_API_URL" --tag infrontend:ci .

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    needs: [verify]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - name: 'Checkout backend'
        uses: actions/checkout@v5
        with:
          repository: fdanielsin/inbackend
          ref: ${{ env.BACKEND_REF }}
          path: inbackend
          ssh-key: ${{ secrets.INBACKEND_DEPLOY_KEY }}
          persist-credentials: false

      - name: 'Setup Go'
        uses: actions/setup-go@v6
        with:
          go-version-file: inbackend/go.mod
          cache: false

      - name: 'Start backend API'
        working-directory: inbackend
        run: |
          go run main.go > "$RUNNER_TEMP/inbackend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/inbackend.pid"

      - name: 'Wait for backend API'
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "Backend API is ready"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/inbackend.log"
          exit 1

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Install Chromium'
        run: bun x playwright install --with-deps chromium

      - name: 'Run E2E tests'
        run: bun run test:e2e -- --project=chromium

  summary:
    name: All checks passed
    runs-on: ubuntu-24.04
    needs: [verify, security, contract, docker, e2e]
    if: always()
    steps:
      - name: 'Verify that required jobs passed'
        run: |
          if [ "${{ needs.verify.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.contract.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Required checks failed"
            exit 1
          fi

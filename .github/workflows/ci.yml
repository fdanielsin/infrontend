name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: '1.3.0'
  PUBLIC_API_URL: 'http://localhost:8080'

jobs:
  # ========== STAGE 1: FORMAT & LINT ==========
  lint:
    name: '1️⃣ Format & Lint'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Prettier check'
        run: bun run format:check

      - name: 'ESLint check'
        run: bun run eslint -- src --max-warnings 10

  # ========== STAGE 2: TYPE CHECK & BUILD ==========
  build:
    name: '2️⃣ Build'
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Type check'
        run: bun run check

      - name: 'Build'
        run: |
          bun run build
          echo "✅ Build successful"

  # ========== STAGE 3: UNIT TESTS ==========
  unit-tests:
    name: '3️⃣ Unit Tests'
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Run unit tests'
        run: bun run test

  # ========== STAGE 4: SECURITY CHECK ==========
  security:
    name: '4️⃣ Security Check'
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Audit dependencies'
        run: |
          bun audit || echo "⚠️ Dependencies checked (non-blocking)"
          echo "✅ Security check completed"

  # ========== STAGE 5: COMPONENT TESTS ==========
  component-tests:
    name: '5️⃣ Component Tests'
    runs-on: ubuntu-24.04
    needs: [unit-tests, security]
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Run component tests'
        run: bun run test

  # ========== STAGE 6: E2E TESTS ==========
  e2e-tests:
    name: '6️⃣ E2E Tests'
    runs-on: ubuntu-24.04
    needs: [component-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - name: 'Checkout backend'
        uses: actions/checkout@v5
        with:
          repository: fdanielsin/inbackend
          ref: develop
          path: inbackend

      - name: 'Setup Go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: 'Start backend API'
        working-directory: inbackend
        run: |
          go run main.go > "$RUNNER_TEMP/inbackend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/inbackend.pid"

      - name: 'Wait for backend API'
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "✅ Backend API is ready"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/inbackend.log"
          exit 1

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Install Chromium'
        run: bun x playwright install --with-deps chromium

      - name: 'Run E2E tests'
        run: |
          bun run test:e2e -- --project=chromium

  # ========== STAGE 7: COVERAGE CHECK ==========
  coverage:
    name: '7️⃣ Coverage Check'
    runs-on: ubuntu-24.04
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v5

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Generate coverage'
        run: bun run test -- --coverage

  # ========== FINAL: SUMMARY ==========
  summary:
    name: '✅ All Checks Passed'
    runs-on: ubuntu-24.04
    needs: [lint, build, unit-tests, security, component-tests, e2e-tests, coverage]
    if: always()
    steps:
      - name: 'Verify all jobs passed'
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.component-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "❌ Critical checks failed"
            exit 1
          fi
          echo "🎉 Frontend CI/CD complete! Ready to merge"

name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
  pull_request:
    branches: [main, develop]
    paths:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd infrontend
          bun install

      - name: Format check
        run: |
          cd infrontend
          bun run format --check

      - name: Lint
        run: |
          cd infrontend
          bun run lint

      - name: Type check
        run: |
          cd infrontend
          bun run check

      - name: Unit tests
        run: |
          cd infrontend
          bun run test

      - name: Build
        run: |
          cd infrontend
          bun run build

      - name: E2E tests (if available)
        run: |
          cd infrontend
          if [ -f "vite.config.ts" ] && grep -q "playwright\|vitest/browser" vite.config.ts; then
            bun run test:e2e || true
          fi

name: Frontend CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**', 'chore/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.0'
  PUBLIC_API_URL: 'http://localhost:8080'

jobs:
  # Same command as locally: format, lint, types, tests with coverage thresholds, build.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Verify'
        run: bun run verify

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Audit dependencies'
        run: bun audit --audit-level=moderate

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: [verify]
    steps:
      - uses: actions/checkout@v7

      - name: 'Build image (no push)'
        run: docker build --build-arg PUBLIC_API_URL="$PUBLIC_API_URL" --tag infrontend:ci .

  # Only the E2E that mock the API (tests/e2e). The ones that need a real backend
  # (tests/e2e/backend) and the contract check run locally before each merge.
  e2e:
    name: 'E2E (mocked API, ${{ matrix.browser }})'
    runs-on: ubuntu-24.04
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Install ${{ matrix.browser }}'
        run: bun x playwright install --with-deps ${{ matrix.browser }}

      - name: 'Run E2E tests'
        run: bun run test:e2e:mocked -- --project=${{ matrix.browser }}

  summary:
    name: All checks passed
    runs-on: ubuntu-24.04
    needs: [verify, security, docker, e2e]
    if: always()
    steps:
      - name: 'Verify that required jobs passed'
        run: |
          if [ "${{ needs.verify.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Required checks failed"
            exit 1
          fi

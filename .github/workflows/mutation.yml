name: Mutation testing

# Separate from ci.yml on purpose: it is slow, so it only runs when tested code changes
# and is not part of the "All checks passed" aggregate.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/unit/**'
      - 'tests/hooks/**'
      - 'messages/**'
      - 'project.inlang/**'
      - 'svelte.config.js'
      - 'vitest.config.ts'
      - 'stryker.config.json'
      - '.github/workflows/mutation.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.0'
  PUBLIC_API_URL: 'http://localhost:59999'

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Generate i18n messages'
        run: bun run i18n:compile

      # Fails the job when the mutation score is below thresholds.break.
      - name: 'Run Stryker'
        run: bunx stryker run --concurrency 2

      - name: 'Upload report'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore
